services:
  - type: web
    name: safus-restaurant-server
    env: node
    region: singapore
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5000
      - key: CLOUDINARY_DEFAULT_FOLDER
        value: safus-restaurant
